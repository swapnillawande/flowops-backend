
services:
  postgres:
    image: postgres:17
    container_name: flowops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowops_db
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
