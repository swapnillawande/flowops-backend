
services:
  postgres:
    image: postgres:17
    container_name: flowops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: flowops_db
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local identity provider only. Real deployments need TLS, managed credentials,
  # and a production Keycloak database/configuration instead of start-dev.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local_admin_only
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./keycloak/flowops-realm.json:/opt/keycloak/data/import/flowops-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # The Keycloak image intentionally has no curl; probe its management port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3' | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  keycloak_data:
  postgres_data:
