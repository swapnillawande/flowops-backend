
spring.application.name=flowops-backend
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/flowops_db
spring.datasource.username=${DB_USERNAME:flowops}
spring.datasource.password=${DB_PASSWORD:flowops_dev_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.jpa.open-in-view=false