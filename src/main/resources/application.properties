
spring.application.name=flowops-backend
server.port=8080

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/flowops_db}
spring.datasource.username=${DB_USERNAME:flowops}
spring.datasource.password=${DB_PASSWORD:flowops_dev_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.jpa.open-in-view=false

# Stock quantities must be whole numbers; reject fractional JSON instead of truncating.
spring.jackson.deserialization.accept-float-as-int=false

# Identity provider. Discovery/key retrieval is lazy so public health is independent of OIDC uptime.
# If the issuer and its internal key endpoint have different addresses, set OIDC_JWK_SET_URI too.
flowops.security.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8082/realms/flowops}
flowops.security.jwk-set-uri=${OIDC_JWK_SET_URI:}
flowops.security.audience=${OIDC_AUDIENCE:flowops-api}
